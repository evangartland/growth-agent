name: Employment Law Intelligence Briefing

on:
  schedule:
    # Run at 6:00 AM AEST (Mon-Fri)
    # AEST is UTC+10, so 6 AM AEST = 8 PM UTC (previous day)
    # During AEDT (daylight saving), adjust to 7 PM UTC
    - cron: '0 20 * * 0-4'  # 6 AM AEST Mon-Fri (UTC 8 PM Sun-Thu)

  workflow_dispatch:  # Allow manual trigger for testing

jobs:
  generate-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Prevent hanging jobs

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generate employment law briefing
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        EMAIL_TO: ${{ secrets.EMAIL_TO }}
        EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
      run: |
        python agent.py

    - name: Upload briefing artifact (backup)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: employment-law-briefing-${{ github.run_number }}
        path: |
          briefing*.txt
        retention-days: 90

    - name: Display completion status
      if: success()
      run: |
        echo "✓ Employment Law Briefing generated and emailed successfully!"
        echo "Focus: Adverse Action | Whistleblowing | Restructures | Modern Awards"
        echo "Industries: Retail | Construction | Healthcare | Manufacturing | Financial Services"
