name: Employment Law Intelligence Briefing

on:
  schedule:
    # Run at 6:00 AM AEST (Mon-Fri)
    # AEST is UTC+10, so 6 AM AEST = 8 PM UTC (previous day)
    - cron: '0 20 * * 0-4'  # 6 AM AEST Mon-Fri (UTC 8 PM Sun-Thu)

  workflow_dispatch:  # Allow manual trigger
    inputs:
      branch:
        description: 'Branch to run from'
        required: false
        default: ''
        type: string

jobs:
  generate-briefing:
    runs-on: ubuntu-22.04  # Use specific version instead of latest
    timeout-minutes: 30
    # Retry strategy for runner acquisition issues
    continue-on-error: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch || github.ref }}

    - name: Display environment info
      run: |
        echo "Branch: ${{ github.ref }}"
        echo "Repository: ${{ github.repository }}"
        echo "Runner: ${{ runner.os }}"
        python3 --version

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip list

    - name: Verify agent.py exists
      run: |
        ls -la agent.py
        head -20 agent.py

    - name: Generate employment law briefing
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        EMAIL_TO: ${{ secrets.EMAIL_TO }}
        EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
      run: |
        echo "Starting briefing generation..."
        python agent.py

    - name: Upload briefing artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: employment-law-briefing-${{ github.run_number }}
        path: |
          briefing*.txt
          seen_articles.json
        retention-days: 90

    - name: Display completion status
      if: success()
      run: |
        echo "✓ Employment Law Briefing generated successfully!"
        echo "Focus: Adverse Action | Whistleblowing | Restructures | Modern Awards"
